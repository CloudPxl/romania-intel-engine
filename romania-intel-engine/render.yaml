services:
  - type: web
    name: ro-intel-engine
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      # Project Settings -> API -> JWT Settings -> JWT Secret in the
      # Supabase dashboard. NOT the anon/publishable key (NEXT_PUBLIC_
      # SUPABASE_ANON_KEY) — that key is itself a JWT signed by this
      # secret, so it can't also serve as the verification key for other
      # tokens. Required for security.py:SecurityGuard.verify_tenant_
      # authorization to validate a user's session token; unset, that
      # function returns 503 rather than silently accepting every request.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GROK_API_KEY
        sync: false
      # Groq and Gemini both have genuinely free tiers (console.groq.com,
      # aistudio.google.com/apikey) — set either one to get LLM-backed
      # copilot answers and document expansion without a paid key. The
      # code tries every configured key in order and fails over between
      # them (see ai_copilot.py:list_llm_providers), so adding one of
      # these does not require removing GROK_API_KEY first.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional: force one provider regardless of which other keys are
      # set (openai | xai | groq | gemini). Leave unset to auto-detect.
      - key: LLM_PROVIDER
        sync: false
      - key: TICK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: ENABLE_LIVE_ELICITATIE
        value: "true"
