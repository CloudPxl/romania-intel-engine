services:
  - type: web
    name: ro-intel-engine
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      # The project's public base URL — security.py derives the JWKS
      # endpoint from it (.../auth/v1/.well-known/jwks.json) to verify
      # session tokens against Supabase's own asymmetric signing keys.
      # Not a secret (the same value is already public in the frontend's
      # NEXT_PUBLIC_SUPABASE_URL); listed with a value so it doesn't need
      # a manual dashboard step, unlike the sync:false secrets below.
      - key: SUPABASE_URL
        value: https://upzyczsfizenlogkfvsa.supabase.co
      # Legacy fallback only — Project Settings -> API -> JWT Settings ->
      # JWT Secret in the Supabase dashboard. NOT the anon/publishable key
      # (NEXT_PUBLIC_SUPABASE_ANON_KEY), which is itself a JWT and can't
      # double as another token's verification key. The project has since
      # moved to asymmetric signing keys (verified: its JWKS advertises
      # ES256, not the RS256 some guides assume), so this is read only
      # when a presented token's own header still says HS256 — a session
      # minted in the short window before the switch, which ages out on
      # its own since Supabase access tokens are short-lived. Safe to
      # leave unset once no such token can still be valid.
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GROK_API_KEY
        sync: false
      # Groq and Gemini both have genuinely free tiers (console.groq.com,
      # aistudio.google.com/apikey) — set either one to get LLM-backed
      # copilot answers and document expansion without a paid key. The
      # code tries every configured key in order and fails over between
      # them (see ai_copilot.py:list_llm_providers), so adding one of
      # these does not require removing GROK_API_KEY first.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Optional: force one provider regardless of which other keys are
      # set (openai | xai | groq | gemini). Leave unset to auto-detect.
      - key: LLM_PROVIDER
        sync: false
      - key: TICK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: ENABLE_LIVE_ELICITATIE
        value: "true"
