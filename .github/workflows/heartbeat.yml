name: Scraper Heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion tick
        run: |
          # Retries matter more than they look: GitHub delivers this
          # schedule only a few times a day in practice, so a single
          # transient failure (a Render deploy in progress, a free-tier
          # dyno waking from sleep) costs hours of ingestion. --retry-all-errors
          # also covers connection resets, which plain --retry ignores.
          curl -sfL --post301 --post302 --post303 -X POST "${{ secrets.RENDER_APP_URL }}/api/v1/system/tick" \
            -H "X-Tick-Secret: ${{ secrets.TICK_SECRET }}" \
            --retry 5 --retry-delay 15 --retry-all-errors --connect-timeout 30 \
            --max-time 280

      - name: Verify freshness
        run: |
          resp=$(curl -sfL --retry 3 --retry-delay 10 --retry-all-errors \
            "${{ secrets.RENDER_APP_URL }}/api/v1/system/status")
          echo "$resp"
          is_stale=$(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin)['is_stale'])")
          if [ "$is_stale" != "False" ]; then
            echo "::error::Ingestion is stale — /api/v1/system/status reports is_stale=true"
            exit 1
          fi
