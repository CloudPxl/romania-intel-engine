name: Scraper Heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      # Render's edge (Cloudflare under the hood) can challenge requests
      # that look headless — no browser fingerprint, default/blank
      # User-Agent. curl's default UA ("curl/8.x") is exactly that
      # fingerprint, so every automated call here impersonates an actual
      # browser's UA string to blend in with normal traffic instead of
      # reading as a bot.
      BROWSER_UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
    steps:
      - name: Trigger ingestion tick
        run: |
          # /api/v1/system/tick now dispatches the ingestion run as a
          # background task and acks immediately (see api.py:system_tick) —
          # it used to block until the whole run finished, which was
          # observed live taking anywhere from ~1s (nothing due) to 373s
          # (real scraping work), well past this call's old 280s
          # --max-time. curl's own retries on that timeout re-POSTed here,
          # starting a *second* full tick on top of the still-running
          # first one — competing for the same rate-limited scrapers and
          # DB connections and making both slower, which is why failures
          # kept compounding rather than clearing on retry. A fast ack
          # needs none of that headroom; --max-time is now just a backstop
          # against a genuinely wedged connection, and retries here now
          # only matter for real transient network failures (a Render
          # deploy in progress, a free-tier dyno waking from sleep), not
          # for waiting out a slow tick.
          curl -sfL --post301 --post302 --post303 -X POST "${{ secrets.RENDER_APP_URL }}/api/v1/system/tick" \
            -A "$BROWSER_UA" \
            -H "X-Tick-Secret: ${{ secrets.TICK_SECRET }}" \
            --retry 5 --retry-delay 15 --retry-all-errors --connect-timeout 30 \
            --max-time 30

      - name: Verify freshness
        run: |
          resp=$(curl -sfL --retry 3 --retry-delay 10 --retry-all-errors \
            -A "$BROWSER_UA" \
            "${{ secrets.RENDER_APP_URL }}/api/v1/system/status")
          echo "$resp"
          is_stale=$(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin)['is_stale'])")
          if [ "$is_stale" != "False" ]; then
            echo "::error::Ingestion is stale — /api/v1/system/status reports is_stale=true"
            exit 1
          fi
